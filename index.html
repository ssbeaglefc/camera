<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Hand Tracking AR</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* CAMERA */
#video {
    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);
}

/* TRACKING CANVAS */
#canvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

/* START SCREEN */
#startScreen {
    position: absolute;

    inset: 0;

    z-index: 20;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #082b20,
            #020202 65%
        );
}

#startScreen h1 {
    font-size: 30px;
    letter-spacing: 2px;

    margin-bottom: 12px;
}

#startScreen p {
    color: #aaa;

    max-width: 300px;

    line-height: 1.5;

    margin-bottom: 25px;
}

#startButton {
    border: none;

    padding: 15px 30px;

    border-radius: 50px;

    background: #00ff9d;

    color: #00150d;

    font-size: 16px;

    font-weight: bold;

    box-shadow:
        0 0 15px #00ff9d,
        0 0 40px #00ff9d55;

    cursor: pointer;
}

/* STATUS */
#status {
    position: absolute;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 9px 18px;

    border-radius: 30px;

    background: rgba(0,0,0,.55);

    backdrop-filter: blur(10px);

    color: white;

    font-size: 13px;

    white-space: nowrap;
}

/* FILTER NAME */
#filterName {
    position: absolute;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 8px 15px;

    border-radius: 20px;

    background: rgba(0,0,0,.55);

    color: white;

    font-size: 12px;
}

/* LOADING */
#loading {
    position: absolute;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    z-index: 30;

    background: #000c;

    color: white;
}
</style>
</head>

<body>

<div id="app">

    <!-- CAMERA -->
    <video
        id="video"
        autoplay
        playsinline>
    </video>

    <!-- TRACKING -->
    <canvas id="canvas"></canvas>

    <!-- STATUS -->
    <div id="status">
        ✋ Tunjukkan tangan ke kamera
    </div>

    <!-- FILTER -->
    <div id="filterName">
        FILTER: -
    </div>

    <!-- START -->
    <div id="startScreen">

        <h1>✋ AI HAND TRACKING</h1>

        <p>
            Izinkan kamera kemudian tunjukkan
            kedua tangan ke kamera.
        </p>

        <button id="startButton">
            BUKA KAMERA
        </button>

    </div>

    <div id="loading">
        Memuat AI Hand Tracking...
    </div>

</div>


<!-- =========================
     MEDIAPIPE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const statusText =
    document.getElementById("status");

const filterName =
    document.getElementById("filterName");

const loading =
    document.getElementById("loading");


/* =================================
   CANVAS
================================= */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =================================
   FILTER
================================= */

const filters = [

    {
        name: "NEON MATRIX",
        color: "#00ff9d"
    },

    {
        name: "CYBER BLUE",
        color: "#00eaff"
    },

    {
        name: "PURPLE ENERGY",
        color: "#b866ff"
    },

    {
        name: "FIRE",
        color: "#ff4d32"
    },

    {
        name: "GOLD",
        color: "#ffd43b"
    },

    {
        name: "ICE",
        color: "#6edbff"
    }

];

let activeFilter = 0;

let lastFilterChange = 0;


/* =================================
   RANDOM FILTER
================================= */

function randomFilter() {

    activeFilter =
        Math.floor(
            Math.random() *
            filters.length
        );

    filterName.innerText =
        "FILTER: " +
        filters[activeFilter].name;

}


/* =================================
   LANDMARK -> SCREEN
================================= */

function point(landmark) {

    return {

        /*
         * Karena kamera ditampilkan
         * mirror / flip horizontal
         */

        x =
            (1 - landmark.x) *
            canvas.width,

        y =
            landmark.y *
            canvas.height

    };

}


/* =================================
   MEDIAPIPE HAND CONNECTIONS
================================= */

/*
    21 landmark tangan:

    0  = wrist

    Thumb:
    1-2-3-4

    Index:
    5-6-7-8

    Middle:
    9-10-11-12

    Ring:
    13-14-15-16

    Pinky:
    17-18-19-20
*/

const connections = [

    /* Wrist -> Thumb */

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    /* Wrist -> Index */

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    /* Wrist -> Middle */

    [0,9],
    [9,10],
    [10,11],
    [11,12],

    /* Wrist -> Ring */

    [0,13],
    [13,14],
    [14,15],
    [15,16],

    /* Wrist -> Pinky */

    [0,17],
    [17,18],
    [18,19],
    [19,20],

    /* Palm */

    [5,9],
    [9,13],
    [13,17]

];


/* =================================
   DRAW HAND SKELETON
================================= */

function drawHand(landmarks, color) {

    const pts =
        landmarks.map(point);


    /* ===============================
       GLOW
    =============================== */

    ctx.save();

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        12;

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        2.5;


    /* ===============================
       CONNECT LANDMARKS
    =============================== */

    connections.forEach(
        connection => {

            const a =
                pts[connection[0]];

            const b =
                pts[connection[1]];


            ctx.beginPath();

            ctx.moveTo(
                a.x,
                a.y
            );

            ctx.lineTo(
                b.x,
                b.y
            );

            ctx.stroke();

        }
    );

    ctx.restore();


    /* ===============================
       LANDMARK POINTS
    =============================== */

    pts.forEach(
        (p, index) => {

            ctx.save();

            ctx.fillStyle =
                color;

            ctx.shadowColor =
                color;

            ctx.shadowBlur =
                15;


            /*
             * Ujung jari dibuat lebih besar
             */

            const fingertips =
                [4,8,12,16,20];

            const radius =
                fingertips.includes(index)
                ? 5
                : 3;


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.restore();

        }
    );

}


/* =================================
   GET HAND CENTER
================================= */

function getHandCenter(hand) {

    const palmPoints = [

        hand[0],
        hand[5],
        hand[9],
        hand[13],
        hand[17]

    ];


    let x = 0;
    let y = 0;


    palmPoints.forEach(
        p => {

            const q =
                point(p);

            x += q.x;
            y += q.y;

        }
    );


    return {

        x: x / palmPoints.length,

        y: y / palmPoints.length

    };

}


/* =================================
   DISTANCE
================================= */

function distance(a,b) {

    return Math.sqrt(

        Math.pow(
            b.x - a.x,
            2
        )

        +

        Math.pow(
            b.y - a.y,
            2
        )

    );

}


/* =================================
   DRAW LINE
================================= */

function line(
    x1,
    y1,
    x2,
    y2,
    color,
    width = 2
) {

    ctx.save();

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        width;

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        15;

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );

    ctx.stroke();

    ctx.restore();

}


/* =================================
   DRAW CENTER SHAPE
================================= */

function drawCenterShape(
    left,
    right,
    color
) {

    const cx =
        (left.x + right.x) / 2;

    const cy =
        (left.y + right.y) / 2;


    let w =
        distance(
            left,
            right
        );


    /*
     * Ukuran shape mengikuti
     * jarak kedua tangan
     */

    w *= 0.9;


    const h =
        w * 0.65;


    const x =
        cx - w / 2;

    const y =
        cy - h / 2;


    /* ==========================
       TRANSPARENT FILL
    ========================== */

    ctx.save();

    ctx.fillStyle =
        color + "12";

    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    /* ==========================
       OUTER RECTANGLE
    ========================== */

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        3;

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        25;

    ctx.strokeRect(
        x,
        y,
        w,
        h
    );


    /* ==========================
       INNER DIAMOND
    ========================== */

    ctx.strokeStyle =
        color + "99";

    ctx.lineWidth =
        2;

    ctx.beginPath();

    ctx.moveTo(
        cx,
        y + 20
    );

    ctx.lineTo(
        x + w - 20,
        cy
    );

    ctx.lineTo(
        cx,
        y + h - 20
    );

    ctx.lineTo(
        x + 20,
        cy
    );

    ctx.closePath();

    ctx.stroke();


    /* ==========================
       CENTER CIRCLE
    ========================== */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        Math.min(w,h) * 0.12,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    ctx.restore();


    /* ==========================
       PARTICLES
    ========================== */

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const px =
            x +
            Math.random() * w;

        const py =
            y +
            Math.random() * h;


        ctx.save();

        ctx.fillStyle =
            color;

        ctx.globalAlpha =
            Math.random() * .7;

        ctx.shadowColor =
            color;

        ctx.shadowBlur =
            10;


        ctx.beginPath();

        ctx.arc(
            px,
            py,
            Math.random() * 2,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();

    }

}


/* =================================
   CONNECT TWO HANDS
================================= */

function connectHands(
    left,
    right,
    color
) {

    /*
     * Garis utama
     */

    line(
        left.x,
        left.y,
        right.x,
        right.y,
        color,
        3
    );


    /*
     * Garis silang
     */

    const offset = 20;


    line(
        left.x,
        left.y - offset,
        right.x,
        right.y + offset,
        color + "66",
        1
    );


    line(
        left.x,
        left.y + offset,
        right.x,
        right.y - offset,
        color + "66",
        1
    );

}


/* =================================
   MEDIAPIPE RESULTS
================================= */

function onResults(results) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const hands =
        results.multiHandLandmarks;


    if (
        !hands ||
        hands.length === 0
    ) {

        statusText.innerText =
            "✋ Tunjukkan tangan ke kamera";

        return;

    }


    /* ==========================
       SATU TANGAN
    ========================== */

    if (hands.length === 1) {

        statusText.innerText =
            "🖐️ 1 tangan terdeteksi";

        drawHand(
            hands[0],
            filters[activeFilter].color
        );

        return;

    }


    /* ==========================
       DUA TANGAN
    ========================== */

    statusText.innerText =
        "✨ 2 tangan terdeteksi";


    const color =
        filters[activeFilter].color;


    /*
     * Gambar skeleton kedua tangan
     */

    drawHand(
        hands[0],
        color
    );

    drawHand(
        hands[1],
        color
    );


    /*
     * Cari pusat kedua tangan
     */

    const hand1 =
        getHandCenter(
            hands[0]
        );

    const hand2 =
        getHandCenter(
            hands[1]
        );


    /*
     * Hubungkan tangan
     */

    connectHands(
        hand1,
        hand2,
        color
    );


    /*
     * Buat shape di tengah
     */

    drawCenterShape(
        hand1,
        hand2,
        color
    );


    /*
     * Ganti filter setiap 4 detik
     */

    if (
        Date.now() -
        lastFilterChange >
        4000
    ) {

        randomFilter();

        lastFilterChange =
            Date.now();

    }

}


/* =================================
   MEDIAPIPE
================================= */

const hands =
    new Hands({

        locateFile: file => {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );

        }

    });


hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


hands.onResults(
    onResults
);


/* =================================
   CAMERA
================================= */

startButton.addEventListener(
    "click",
    async () => {

        startScreen.style.display =
            "none";

        loading.style.display =
            "flex";


        try {

            randomFilter();


            const camera =
                new Camera(
                    video,
                    {

                        onFrame:
                            async () => {

                                await hands.send({
                                    image: video
                                });

                            },

                        width: 1280,

                        height: 720

                    }
                );


            await camera.start();


            loading.style.display =
                "none";

        }

        catch (error) {

            console.error(error);

            loading.style.display =
                "none";

            startScreen.style.display =
                "flex";

            alert(
                "Kamera gagal dibuka.\n\n" +
                "Pastikan izin kamera sudah diberikan " +
                "dan website dibuka menggunakan HTTPS."
            );

        }

    }
);

</script>

</body>
</html>
