<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Hand Tracking AR</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

/* CAMERA */
#video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* CANVAS */
#canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* START SCREEN */
#startScreen {
    position: absolute;
    inset: 0;
    z-index: 20;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 25px;
    text-align: center;
    color: white;

    background:
        radial-gradient(
            circle at center,
            #123b2b,
            #020202 70%
        );
}

#startScreen h1 {
    font-size: 28px;
    margin: 0 0 12px;
}

#startScreen p {
    max-width: 320px;
    color: #aaa;
    line-height: 1.5;
}

#startButton {
    margin-top: 20px;
    padding: 15px 30px;

    border: 0;
    border-radius: 50px;

    background: #00ff88;
    color: #00150b;

    font-size: 16px;
    font-weight: bold;

    box-shadow:
        0 0 15px #00ff88,
        0 0 40px #00ff8855;
}

/* STATUS */
#status {
    position: absolute;
    z-index: 10;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    padding: 9px 16px;

    max-width: 90%;

    border-radius: 30px;

    background: rgba(0,0,0,.6);

    color: white;
    font-size: 13px;
    text-align: center;

    backdrop-filter: blur(8px);
}

/* FILTER */
#filterName {
    position: absolute;
    z-index: 10;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    padding: 8px 15px;

    border-radius: 20px;

    background: rgba(0,0,0,.6);

    color: white;
    font-size: 12px;

    backdrop-filter: blur(8px);
}
</style>
</head>

<body>

<div id="app">

    <video id="video" autoplay playsinline></video>

    <canvas id="canvas"></canvas>

    <div id="status">
        Kamera belum aktif
    </div>

    <div id="filterName">
        FILTER: -
    </div>

    <div id="startScreen">

        <h1>✋ AI HAND TRACKING</h1>

        <p>
            Aktifkan kamera lalu tunjukkan
            tangan ke kamera.
            Gunakan dua tangan untuk
            mengaktifkan efek AR.
        </p>

        <button id="startButton">
            BUKA KAMERA
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

/* =====================================
   ELEMENT
===================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const filterName =
    document.getElementById("filterName");


/* =====================================
   CANVAS
===================================== */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================
   FILTER
===================================== */

const filters = [

    {
        name: "NEON GREEN",
        color: "#00ff88",
        type: "normal"
    },

    {
        name: "CYBER BLUE",
        color: "#00eaff",
        type: "rgb"
    },

    {
        name: "PURPLE ENERGY",
        color: "#b866ff",
        type: "blur"
    },

    {
        name: "NEGATIVE",
        color: "#ffffff",
        type: "negative"
    },

    {
        name: "FIRE",
        color: "#ff5533",
        type: "fire"
    },

    {
        name: "GOLD",
        color: "#ffd700",
        type: "gold"
    },

    {
        name: "ICE",
        color: "#66ddff",
        type: "ice"
    },

    {
        name: "GLITCH",
        color: "#ff00ff",
        type: "glitch"
    }

];

let filterIndex = 0;

let lastFilterChange =
    Date.now();

function changeFilter() {

    filterIndex =
        Math.floor(
            Math.random() *
            filters.length
        );

    filterName.innerText =
        "FILTER: " +
        filters[filterIndex].name;

}


/* =====================================
   POINT
===================================== */

function getPoint(p) {

    return {

        x:
            p.x *
            canvas.width,

        y:
            p.y *
            canvas.height

    };

}


/* =====================================
   HAND CONNECTIONS
===================================== */

const connections = [

    /* THUMB */
    [0,1],
    [1,2],
    [2,3],
    [3,4],

    /* INDEX */
    [0,5],
    [5,6],
    [6,7],
    [7,8],

    /* MIDDLE */
    [0,9],
    [9,10],
    [10,11],
    [11,12],

    /* RING */
    [0,13],
    [13,14],
    [14,15],
    [15,16],

    /* PINKY */
    [0,17],
    [17,18],
    [18,19],
    [19,20],

    /* PALM */
    [5,9],
    [9,13],
    [13,17]

];


/* =====================================
   DRAW HAND
===================================== */

function drawHand(
    landmarks,
    color
) {

    const points =
        landmarks.map(
            getPoint
        );

    ctx.save();

    ctx.strokeStyle =
        color;

    ctx.lineWidth = 2.5;

    ctx.shadowColor =
        color;

    ctx.shadowBlur = 12;


    connections.forEach(
        pair => {

            const a =
                points[pair[0]];

            const b =
                points[pair[1]];

            ctx.beginPath();

            ctx.moveTo(
                a.x,
                a.y
            );

            ctx.lineTo(
                b.x,
                b.y
            );

            ctx.stroke();

        }
    );

    ctx.restore();


    /* POINTS */

    points.forEach(
        (p, i) => {

            const fingertips =
                [4,8,12,16,20];

            const radius =
                fingertips.includes(i)
                ? 5
                : 3;

            ctx.save();

            ctx.fillStyle =
                color;

            ctx.shadowColor =
                color;

            ctx.shadowBlur = 15;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.restore();

        }
    );

}


/* =====================================
   HAND CENTER
===================================== */

function handCenter(hand) {

    const ids = [
        0,
        5,
        9,
        13,
        17
    ];

    let x = 0;
    let y = 0;

    ids.forEach(
        id => {

            const p =
                getPoint(
                    hand[id]
                );

            x += p.x;
            y += p.y;

        }
    );

    return {

        x:
            x / ids.length,

        y:
            y / ids.length

    };

}


/* =====================================
   DISTANCE
===================================== */

function distance(a,b) {

    return Math.sqrt(

        Math.pow(
            a.x - b.x,
            2
        )

        +

        Math.pow(
            a.y - b.y,
            2
        )

    );

}


/* =====================================
   BETWEEN HANDS
===================================== */

function drawBetweenHands(
    hand1,
    hand2,
    color,
    type
) {

    const d =
        distance(
            hand1,
            hand2
        );

    const centerX =
        (hand1.x + hand2.x) / 2;

    const centerY =
        (hand1.y + hand2.y) / 2;


    /*
       LIMIT EFFECT
    */

    const width =
        Math.max(
            150,
            Math.min(
                d * 1.1,
                canvas.width * .9
            )
        );

    const height =
        width * .55;

    const x =
        centerX -
        width / 2;

    const y =
        centerY -
        height / 2;


    /* =================================
       OUTER ENERGY
    ================================= */

    ctx.save();

    ctx.strokeStyle =
        color;

    ctx.lineWidth = 3;

    ctx.shadowColor =
        color;

    ctx.shadowBlur = 25;

    ctx.beginPath();

    ctx.moveTo(
        hand1.x,
        hand1.y
    );

    ctx.lineTo(
        hand2.x,
        hand2.y
    );

    ctx.stroke();

    ctx.restore();


    /* =================================
       EFFECT AREA
    ================================= */

    ctx.save();

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        width,
        height,
        30
    );

    ctx.clip();


    /* BASE */
    ctx.fillStyle =
        color + "18";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    /* =================================
       BLUR EFFECT
    ================================= */

    if (
        type === "blur" ||
        type === "ice"
    ) {

        ctx.filter =
            "blur(12px)";

        for (
            let i = 0;
            i < 10;
            i++
        ) {

            ctx.fillStyle =
                color + "30";

            ctx.beginPath();

            ctx.arc(
                x +
                Math.random() *
                width,

                y +
                Math.random() *
                height,

                30 +
                Math.random() * 60,

                0,
                Math.PI * 2
            );

            ctx.fill();

        }

    }


    /* =================================
       NEGATIVE
    ================================= */

    if (
        type === "negative"
    ) {

        ctx.globalCompositeOperation =
            "difference";

        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            x,
            y,
            width,
            height
        );

        ctx.globalCompositeOperation =
            "source-over";

    }


    /* =================================
       RGB
    ================================= */

    if (
        type === "rgb"
    ) {

        const rgbColors = [
            "#ff0055",
            "#00ffff",
            "#5500ff"
        ];

        for (
            let i = 0;
            i < 18;
            i++
        ) {

            ctx.fillStyle =
                rgbColors[
                    i %
                    rgbColors.length
                ];

            ctx.globalAlpha =
                .12;

            ctx.beginPath();

            ctx.arc(
                x +
                Math.random() *
                width,

                y +
                Math.random() *
                height,

                15 +
                Math.random() * 40,

                0,
                Math.PI * 2
            );

            ctx.fill();

        }

        ctx.globalAlpha = 1;

    }


    /* =================================
       FIRE
    ================================= */

    if (
        type === "fire"
    ) {

        for (
            let i = 0;
            i < 35;
            i++
        ) {

            const px =
                x +
                Math.random() *
                width;

            const py =
                y +
                Math.random() *
                height;

            ctx.fillStyle =
                Math.random() > .5
                ? "#ff3300"
                : "#ffaa00";

            ctx.globalAlpha =
                Math.random() * .7;

            ctx.beginPath();

            ctx.arc(
                px,
                py,
                Math.random() * 5 + 1,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

        ctx.globalAlpha = 1;

    }


    /* =================================
       GOLD
    ================================= */

    if (
        type === "gold"
    ) {

        for (
            let i = 0;
            i < 30;
            i++
        ) {

            const px =
                x +
                Math.random() *
                width;

            const py =
                y +
                Math.random() *
                height;

            ctx.fillStyle =
                "#ffd700";

            ctx.shadowColor =
                "#ffd700";

            ctx.shadowBlur = 15;

            ctx.beginPath();

            ctx.arc(
                px,
                py,
                Math.random() * 3,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

    }


    /* =================================
       GLITCH
    ================================= */

    if (
        type === "glitch"
    ) {

        for (
            let i = 0;
            i < 30;
            i++
        ) {

            const gy =
                y +
                Math.random() *
                height;

            ctx.fillStyle =
                Math.random() > .5
                ? "#ff00ff"
                : "#00ffff";

            ctx.globalAlpha =
                .4;

            ctx.fillRect(

                x +
                Math.random() *
                width,

                gy,

                20 +
                Math.random() * 80,

                2 +
                Math.random() * 5

            );

        }

        ctx.globalAlpha = 1;

    }


    /* =================================
       WAVE
    ================================= */

    ctx.filter =
        "none";

    ctx.globalAlpha =
        .8;

    ctx.strokeStyle =
        color;

    ctx.lineWidth = 2;

    ctx.shadowColor =
        color;

    ctx.shadowBlur = 15;


    for (
        let wave = 0;
        wave < 4;
        wave++
    ) {

        ctx.beginPath();

        for (
            let i = 0;
            i <= width;
            i += 10
        ) {

            const waveY =
                centerY +
                Math.sin(
                    i * .035 +
                    performance.now() *
                    .004 +
                    wave
                ) *
                15;

            if (i === 0) {

                ctx.moveTo(
                    x + i,
                    waveY
                );

            } else {

                ctx.lineTo(
                    x + i,
                    waveY
                );

            }

        }

        ctx.stroke();

    }

    ctx.restore();


    /* =================================
       CONNECT FINGERS
    ================================= */

    drawCrossConnections(
        hand1,
        hand2,
        color
    );


    /* =================================
       CENTER ENERGY
    ================================= */

    ctx.save();

    ctx.strokeStyle =
        color;

    ctx.lineWidth = 3;

    ctx.shadowColor =
        color;

    ctx.shadowBlur = 30;

    const pulse =
        20 +
        Math.sin(
            performance.now() * .006
        ) * 8;

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        pulse,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();

}


/* =====================================
   CROSS CONNECTIONS
===================================== */

function drawCrossConnections(
    hand1,
    hand2,
    color
) {

    /*
       Jari-jari:
       thumb
       index
       middle
       ring
       pinky
    */

    const fingers = [
        [4,4],
        [8,8],
        [12,12],
        [16,16],
        [20,20]
    ];


    fingers.forEach(
        pair => {

            const a =
                getPoint(
                    hand1[pair[0]]
                );

            const b =
                getPoint(
                    hand2[pair[1]]
                );


            ctx.save();

            ctx.strokeStyle =
                color;

            ctx.lineWidth = 2;

            ctx.shadowColor =
                color;

            ctx.shadowBlur = 15;

            ctx.globalAlpha =
                .8;


            ctx.beginPath();

            ctx.moveTo(
                a.x,
                a.y
            );

            /*
               CURVE
            */

            const cx =
                (a.x + b.x) / 2;

            const cy =
                (a.y + b.y) / 2;

            ctx.quadraticCurveTo(

                cx,
                cy -
                40,

                b.x,
                b.y

            );

            ctx.stroke();

            ctx.restore();

        }
    );

}


/* =====================================
   MEDIAPIPE
===================================== */

const hands =
    new Hands({

        locateFile: file => {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );

        }

    });


hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 1,

    minDetectionConfidence: .6,

    minTrackingConfidence: .6

});


/* =====================================
   RESULTS
===================================== */

hands.onResults(
    function(results) {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const detected =
            results.multiHandLandmarks;


        if (
            !detected ||
            detected.length === 0
        ) {

            status.innerText =
                "✋ Tunjukkan tangan";

            return;

        }


        const currentFilter =
            filters[
                filterIndex
            ];


        const color =
            currentFilter.color;


        /* =================================
           DRAW HANDS
        ================================= */

        detected.forEach(
            hand => {

                drawHand(
                    hand,
                    color
                );

            }
        );


        /* =================================
           TWO HANDS
        ================================= */

        if (
            detected.length >= 2
        ) {

            status.innerText =
                "⚡ 2 TANGAN TERHUBUNG";

            drawBetweenHands(

                detected[0],
                detected[1],

                color,

                currentFilter.type

            );

        }

        else {

            status.innerText =
                "🖐️ 1 tangan terdeteksi";

        }


        /* =================================
           CHANGE FILTER
        ================================= */

        if (
            Date.now() -
            lastFilterChange >
            5000
        ) {

            changeFilter();

            lastFilterChange =
                Date.now();

        }

    }
);


/* =====================================
   CAMERA
===================================== */

startButton.addEventListener(
    "click",
    async function() {

        status.innerText =
            "⏳ Meminta izin kamera...";


        try {

            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices
                .getUserMedia
            ) {

                throw new Error(
                    "Browser tidak mendukung kamera."
                );

            }


            const stream =
                await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "user",

                        width: {
                            ideal: 1280
