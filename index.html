<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Camera Test</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;
}

#video {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;
}

#start {
    position: fixed;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background:
        radial-gradient(
            circle,
            #123d2c,
            #000 70%
        );

    color: white;

    text-align: center;
}

h1 {
    margin-bottom: 10px;
}

p {
    color: #aaa;

    max-width: 300px;

    line-height: 1.5;
}

button {
    margin-top: 20px;

    padding: 15px 30px;

    border: none;

    border-radius: 50px;

    background: #00ff88;

    color: #00150b;

    font-size: 16px;

    font-weight: bold;
}

#status {
    position: fixed;

    left: 50%;
    bottom: 30px;

    transform: translateX(-50%);

    z-index: 10;

    padding: 10px 16px;

    border-radius: 20px;

    background: rgba(0,0,0,.7);

    color: white;

    text-align: center;

    max-width: 90%;
}

</style>
</head>

<body>

<video
    id="video"
    autoplay
    playsinline>
</video>

<div id="start">

    <h1>📷 Camera Test</h1>

    <p>
        Tekan tombol di bawah untuk
        mengaktifkan kamera.
    </p>

    <button id="button">
        BUKA KAMERA
    </button>

</div>

<div id="status">
    Kamera belum aktif
</div>


<script>

const video =
    document.getElementById("video");

const button =
    document.getElementById("button");

const start =
    document.getElementById("start");

const status =
    document.getElementById("status");


button.addEventListener(
    "click",
    async function() {

        status.innerText =
            "⏳ Meminta izin kamera...";


        try {

            /*
             * Pastikan browser mendukung
             * kamera
             */

            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
            ) {

                throw new Error(
                    "Browser tidak mendukung akses kamera."
                );

            }


            /*
             * Meminta kamera depan
             */

            const stream =
                await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "user"

                    },

                    audio: false

                });


            /*
             * Masukkan kamera ke video
             */

            video.srcObject =
                stream;


            /*
             * Tampilkan video
             */

            video.style.display =
                "block";


            start.style.display =
                "none";


            status.innerText =
                "✅ Kamera aktif";


        }

        catch(error) {

            console.error(error);


            status.innerText =
                "❌ Kamera gagal: " +
                error.message;


            alert(
                "Kamera gagal dibuka.\n\n" +
                error.message
            );

        }

    }
);

</script>

</body>
</html>
